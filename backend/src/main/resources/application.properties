# =========================================================
# Loyalty Rewards - application.properties
# =========================================================

spring.application.name=loyalty-rewards

# ---------------------------------------------------------
# DEFAULT: MySQL
# Create the database first:  CREATE DATABASE loyalty_rewards;
# Then update the username/password below to match your setup.
# ---------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/loyalty_rewards?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------
# ALTERNATIVE: H2 in-memory (zero setup, data resets on restart)
# Comment out the MySQL block above and uncomment everything
# below to try the app without installing MySQL first.
# ---------------------------------------------------------
# spring.datasource.url=jdbc:h2:mem:loyalty_rewards;DB_CLOSE_DELAY=-1
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

server.port=8080
